name: Build Windows full sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
      - name: Add MinGW to PATH
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Resolve newly added Flutter dependencies
        shell: pwsh
        run: flutter pub get
      - name: Build and package full-source Windows app
        shell: pwsh
        run: python scripts/build_windows.py --all-sources
      - name: Install media regression dependency
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Verify packaged Windows playback
        shell: pwsh
        run: |
          $env:GUOAPP_TEST_LIBMPV = (Resolve-Path 'build/windows/x64/runner/Release/libmpv-2.dll').Path
          $env:GUOAPP_TEST_PYTHON = (Get-Command python).Source
          Get-Command ffmpeg -ErrorAction Stop
          Set-Location native
          go test ./core -run 'TestNative(Stream|HLSExtensionless)' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 30
